<h2>Contact Clayton Township</h2>
<p><strong>Township Hall:</strong> 1057 Dobler Road, Sterling, MI 48659</p>

<section class="card" style="max-width: 600px; margin-top: 1.5rem;">
  <h3>Send Us a Message</h3>
  <form id="contact-form">
    <div style="margin-bottom: 1rem;">
      <label for="full-name" style="display: block; font-weight: bold;">Full Name</label>
      <input type="text" id="full-name" name="name" required style="width: 100%; padding: 8px; margin-top: 4px;">
    </div>
    
    <div style="margin-bottom: 1rem;">
      <label for="email" style="display: block; font-weight: bold;">Email Address</label>
      <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 4px;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label for="message" style="display: block; font-weight: bold;">Message</label>
      <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 8px; margin-top: 4px;"></textarea>
    </div>

    <button type="submit" style="background: #1b365d; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">Send Message</button>
  </form>
</section>
